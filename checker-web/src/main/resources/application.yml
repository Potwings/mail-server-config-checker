mailcheck:
  dns-timeout: 3s
  check-timeout: 12s
  intake:
    enabled: true
    incoming-dir: /var/lib/maildiag/incoming
    data-dir: ./data
    mail-domain: mail-check.yonggeon.kr
    poll-interval: 5s
    # 수신 매칭 기준 TTL — 만료 후 도착 메일은 스킵, 기존 결과는 계속 조회 가능
    session-ttl: 24h
  rbl:
    spamhaus-dqs-key: ${SPAMHAUS_DQS_KEY:}
    barracuda-enabled: true
    spamcop-enabled: true
    psbl-enabled: true
    mailspike-enabled: true
    hostkarma-enabled: true
  propagation-resolvers:
    - "Google=8.8.8.8"
    - "Cloudflare=1.1.1.1"
    - "Quad9=9.9.9.9"
    - "OpenDNS=208.67.222.222"
    - "KT=168.126.63.1"
    - "SK Broadband=219.250.36.130"
    - "LG U+=164.124.101.2"
