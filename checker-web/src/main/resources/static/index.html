<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail Health Check</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1a202c; --muted: #64748b; --border: #e2e8f0;
    --pass: #16a34a; --warn: #d97706; --fail: #dc2626; --skip: #64748b; --error: #7c3aed;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 880px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
  form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  input { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; background: var(--card); }
  #domain { flex: 2 1 240px; }
  #ip { flex: 1 1 160px; }
  button { padding: 12px 22px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--muted); font-size: .82rem; margin: 0 0 24px; }
  .meta { color: var(--muted); font-size: .88rem; margin: 18px 2px 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
  .card summary { list-style: none; cursor: pointer; padding: 16px 20px; font-size: 1.05rem; font-weight: 600; display: flex; align-items: center; gap: 10px; user-select: none; }
  .card summary::-webkit-details-marker { display: none; }
  .card summary:hover { background: #f8fafc; }
  .badge { font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; color: #fff; letter-spacing: .5px; }
  .elapsed { margin-left: auto; font-size: .78rem; color: var(--muted); font-weight: 400; }
  .peek { font-size: .82rem; color: var(--muted); font-weight: 400; max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chev { color: var(--muted); font-size: .8rem; transition: transform .15s; }
  .card[open] .chev { transform: rotate(90deg); }
  .card[open] .peek { display: none; }
  .detail { padding: 0 20px 18px; border-top: 1px solid var(--border); }
  ul { margin: 12px 0 0; padding-left: 20px; }
  li { margin: 4px 0; font-size: .92rem; word-break: break-all; }
  .guide { margin-top: 12px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 10px 14px; font-size: .9rem; }
  .guide li { margin: 4px 0; }
  .summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .chip { font-size: .82rem; padding: 5px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); }
  .err-box { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; border-radius: 10px; padding: 12px 16px; }
  .spin { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: r .7s linear infinite; vertical-align: -3px; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mail Health Check</h1>
  <p class="sub">도메인 하나로 SPF · DMARC · MX · PTR/FCrDNS · RBL · DNS 전파를 한 번에 진단합니다.</p>

  <form id="form">
    <input id="domain" placeholder="도메인 (예: example.com)" required autocomplete="off">
    <input id="ip" placeholder="발신 IP (선택)" autocomplete="off">
    <button id="go" type="submit">진단</button>
  </form>
  <p class="hint">IP를 비우면 MX 호스트의 A 레코드에서 도출한 수신 서버 IP로 PTR/RBL을 검사합니다 (발신 전용 IP가 분리된 환경이라면 직접 입력).</p>

  <div id="out"></div>
</div>

<script>
const COLORS = { PASS: 'var(--pass)', WARN: 'var(--warn)', FAIL: 'var(--fail)', SKIP: 'var(--skip)', ERROR: 'var(--error)' };
const form = document.getElementById('form');
const out = document.getElementById('out');
const go = document.getElementById('go');

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const domain = document.getElementById('domain').value.trim();
  const ip = document.getElementById('ip').value.trim();
  if (!domain) return;

  go.disabled = true;
  go.innerHTML = '<span class="spin"></span>';
  out.innerHTML = '';
  try {
    const params = new URLSearchParams({ domain });
    if (ip) params.set('ip', ip);
    const res = await fetch('/api/v1/diagnose?' + params);
    const body = await res.json();
    if (!res.ok) {
      out.innerHTML = '<div class="err-box">' + esc(body.error || ('요청 실패 (' + res.status + ')')) + '</div>';
      return;
    }
    render(body);
  } catch (err) {
    out.innerHTML = '<div class="err-box">서버에 연결할 수 없습니다: ' + esc(err.message) + '</div>';
  } finally {
    go.disabled = false;
    go.textContent = '진단';
  }
});

function render(report) {
  const counts = {};
  report.results.forEach(r => counts[r.status] = (counts[r.status] || 0) + 1);
  const chips = Object.entries(counts)
    .map(([s, n]) => '<span class="chip"><b style="color:' + COLORS[s] + '">' + s + '</b> ' + n + '</span>')
    .join('');

  const ipInfo = report.targetIp
    ? 'PTR/RBL 대상 IP: ' + esc(report.targetIp) + ' — ' + esc(report.targetIpSource)
    : 'PTR/RBL 대상 IP 확인 불가';

  let html = '<div class="summary">' + chips + '</div>'
    + '<p class="meta">' + esc(report.domain) + ' · ' + ipInfo + ' · 총 ' + report.totalElapsedMs + 'ms</p>';

  for (const r of report.results) {
    // Problem cards (WARN included) start expanded; PASS/SKIP stay collapsed until clicked.
    const open = (r.status === 'FAIL' || r.status === 'ERROR' || r.status === 'WARN') ? ' open' : '';
    const peek = r.evidence.length ? r.evidence[0] : '';
    html += '<details class="card"' + open + '>'
      + '<summary><span class="badge" style="background:' + COLORS[r.status] + '">' + r.status + '</span>'
      + esc(r.title)
      + (peek ? '<span class="peek">' + esc(peek) + '</span>' : '')
      + '<span class="elapsed">' + r.elapsedMs + 'ms</span>'
      + '<span class="chev">▶</span></summary>'
      + '<div class="detail">';
    if (r.evidence.length) {
      html += '<ul>' + r.evidence.map(ev => '<li>' + esc(ev) + '</li>').join('') + '</ul>';
    }
    if (r.guidance.length) {
      html += '<div class="guide"><b>개선 가이드</b><ul>'
        + r.guidance.map(g => '<li>' + esc(g) + '</li>').join('') + '</ul></div>';
    }
    if (!r.evidence.length && !r.guidance.length) {
      html += '<p class="hint" style="margin:12px 0 0">추가 상세 정보가 없습니다.</p>';
    }
    html += '</div></details>';
  }
  out.innerHTML = html;
}
</script>
</body>
</html>
