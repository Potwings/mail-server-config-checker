plugins {
    id 'java-library'
}

dependencies {
    api project(':checker-core')

    // Boot 3.5.3이 관리하는 Jackson 버전과 정렬 (checker-web 클래스패스 충돌 방지)
    implementation platform('com.fasterxml.jackson:jackson-bom:2.19.1')
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // From: 헤더 전용 lenient 파싱 (M8 jDKIM도 mime4j 기반 — 스택 충돌 없음)
    implementation 'org.apache.james:apache-mime4j-dom:0.8.11'
    implementation 'org.slf4j:slf4j-api:2.0.17'

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testImplementation 'org.assertj:assertj-core:3.27.3'
}
